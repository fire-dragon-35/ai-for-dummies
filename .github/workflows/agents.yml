name: agents
on: [push, pull_request]
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: sh .agents/hooks/pre-push
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: sh .agents/repository-context/generate.sh && git diff --exit-code .agents/repository-context/directories.md
